info:
  name: GET TIPPs
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/tipp?per_page=10&page=1"
  params:
    - name: per_page
      value: "10"
      type: query
    - name: page
      value: "1"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
